[project]
name = "django-db-embedding"
version = "0.0.1"
description = "A Django app to integrate Database vector embeddings for semantic search."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2.12",
    "pgvector>=0.4.1",
    "python-dotenv>=1.2.1",
    "django>=5.2.7",
    "orjson>=3.11.4",
    "django-ninja>=1.4.5",
    "redis[hiredis]>=7.0.1",
    "celery>=5.5.3",
    "celery-types>=0.23.0",
    "openai>=2.7.1",
    "cohere>=5.20.0",
    "py-cpuinfo>=9.0.0"
]


# ----------------------------------------------------------------------
# 3. Dependency groups (dev / deploy / ml)
# ----------------------------------------------------------------------
[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "psutil>=7.1.3",
    "ruff>=0.14.2",
]
deploy = [
    "gunicorn>=23.0.0",
    "uvicorn>=0.38.0",
    "whitenoise[brotli]>=6.11.0",
]


# ----------------------------------------------------------------------
# 4. UV index configuration (official PyTorch wheels + PyPI)
# ----------------------------------------------------------------------
[project.optional-dependencies]
torch-cpu = [
    "torch>=2.9.0",
    "hf-xet>=1.2.0",
    "sentence-transformers>=5.1.2"
]
torch-cu128 = [
    "torch>=2.9.0",
    "hf-xet>=1.2.0",
    "sentence-transformers>=5.1.2"
]

#torch-rocm = [
#    "torch>=2.9.0; sys_platform == 'linux'",
#    "hf-xet>=1.2.0; sys_platform == 'linux'",
#    "sentence-transformers>=5.1.2; sys_platform == 'linux'"
#]

onnx-cpu = [
    "onnxruntime>=1.23.2",
    "hf-xet>=1.2.0",
    "sentence-transformers[onnx]>=5.1.2",   # pulls onnx, tokenizers, transformers
]
onnx-gpu = [
    "onnxruntime-gpu>=1.23.2",             # CUDA 12.1 + cuDNN
    "hf-xet>=1.2.0",
    "sentence-transformers[onnx-gpu]>=5.1.2",
]
#onnx-directml = [
#    "onnxruntime-directml>=1.23.2",        # Windows AMD/Intel/NVIDIA
#    "hf-xet>=1.2.0",
#    "sentence-transformers[onnx]>=5.1.2",
#]

[tool.uv]
conflicts = [
  [
    { extra = "torch-cpu" },
    { extra = "torch-cu128" },
#    { extra = "torch-rocm" },
  ],
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu" },
  { index = "pytorch-cu128", extra = "torch-cu128" },
#  { index = "pytorch-rocm", extra = "torch-rocm" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

#[[tool.uv.index]]
#name = "pytorch-rocm"
#url = "https://download.pytorch.org/whl/rocm6.4"
#explicit = true

#[[tool.uv.index]]
#name = "pytorch-triton-rocm"
#url = "https://download.pytorch.org/whl/pytorch-triton-rocm"
#explicit = true

# ----------------------------------------------------------------------
# 5. Code-style tools
# ----------------------------------------------------------------------
[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120