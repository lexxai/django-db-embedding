[project]
name = "django-db-embedding"
version = "0.0.1"
description = "A Django app to integrate Database vector embeddings for semantic search."
requires-python = ">=3.12"
dependencies = [
    "celery>=5.5.3",
    "django>=5.2.7",
    "django-ninja>=1.4.5",
    "openai>=2.6.1",
    "pgvector>=0.4.1",
    "psycopg[binary,pool]>=3.2.12",
    "python-dotenv>=1.2.1",
    "redis[hiredis]>=7.0.1",
]

[dependency-groups]
dev = [
    "gunicorn>=23.0.0",
    "uvicorn>=0.38.0",
    "whitenoise[brotli]>=6.11.0",
]
